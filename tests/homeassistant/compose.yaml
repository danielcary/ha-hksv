services:
  engine:
    build:
      context: ../../addon
      target: production
    environment:
      HKSV_API_TOKEN: integration-test-token-not-for-production
      HKSV_BIND_ADDRESS: 0.0.0.0
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8099/v1/status',{headers:{Authorization:'Bearer '+process.env.HKSV_API_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 20
  ha-tests:
    build:
      context: ../..
      dockerfile: tests/homeassistant/Dockerfile
    depends_on:
      engine:
        condition: service_healthy
    environment:
      HKSV_API_TOKEN: integration-test-token-not-for-production
      HKSV_ENGINE_URL: http://engine:8099
    # No host ports, real HA config mounts, or access to Docker's socket.
